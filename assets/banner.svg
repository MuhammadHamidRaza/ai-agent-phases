  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="12" height="340" rx="6" fill="url(#accent)"/>

  <text x="60" y="108" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Agent Phase Kit</text>
