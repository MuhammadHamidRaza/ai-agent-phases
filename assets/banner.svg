  <g font-family="Segoe UI, Arial, Helvetica, sans-serif">
    <rect x="60" y="226" width="250" height="72" rx="14" fill="#111c33" stroke="url(#accent)" stroke-width="2"/>
    <text x="84" y="259" font-size="22" font-weight="700" fill="#ffffff">AGENTS.md</text>
    <text x="84" y="284" font-size="16" fill="#94a3b8">the rules</text>

    <rect x="340" y="226" width="250" height="72" rx="14" fill="#111c33" stroke="url(#accent)" stroke-width="2"/>
    <text x="364" y="259" font-size="22" font-weight="700" fill="#ffffff">PHASES.md</text>
    <text x="364" y="284" font-size="16" fill="#94a3b8">the plan and the gates</text>

    <rect x="620" y="226" width="250" height="72" rx="14" fill="#111c33" stroke="url(#accent)" stroke-width="2"/>
    <text x="644" y="259" font-size="22" font-weight="700" fill="#ffffff">PROGRESS.md</text>
